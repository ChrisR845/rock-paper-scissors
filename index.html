<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

        <element class="center-text"><h1>You VS Computer </h1></element>

    <form action="" method="post">
    <input type="image" src="OIP.webp" alt="Submit" width="150" height="50" class="Rock">
</form>
    <form action="" method="post">
    <input type="image" src="download.webp" alt="Submit" width="150" height="50" class="Paper">
</form>
    <form action="" method="post">
    <input type="image" src="download (2).webp" alt="Submit" width="150" height="50" class="Scissors">
</form>
    <form action="" method="post">
    <input type="image" src="OIP (1).webp" alt="Submit" width="150" height="50" class="Reset">
</form>
    <img src="OIP (3).webp" alt="" class="Human">
        
    <img src="OIP (2).webp" alt="" class="Robot">

    <h1>RESULTS:</h1>

    <p>Your Score:</p>
    <p>Robot Score:</p>

    <div class="container">




        <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#instructionsModal">
            Show Instructions
        </button>


        <!-- Modal -->
        <div class="modal fade" id="instructionsModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
            aria-labelledby="instructionsModalLabel" aria-hidden="false">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="instructionsModalLabel">How to Play <strong>Rock</strong>, <strong>Paper</strong>, <strong>Scissors</strong></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Rock paper scissors is a quick 2-player game:

                        🪨 beats ✂️
                        ✂️ beats 📄
                        📄 beats 🪨

                        Pick one at the same time—same choice = tie 🤝
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var instructionsModal = new bootstrap.Modal(document.getElementById('instructionsModal'));
            instructionsModal.show();
        });
    </script>
</body>
</html>
